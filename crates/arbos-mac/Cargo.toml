[package]
name = "arbos-mac"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Arbos desktop client (GPUI)"
build = "build.rs"

[[bin]]
name = "arbos-mac"
path = "src/main.rs"

[dependencies]
arbos-core.workspace = true
arbos-update.workspace = true
rusqlite.workspace = true

anyhow.workspace = true
futures.workspace = true
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
reqwest.workspace = true
ulid.workspace = true
base64.workspace = true
sha2.workspace = true
chrono.workspace = true

gpui = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54", features = ["wayland", "x11", "font-kit", "runtime_shaders"] }
gpui_tokio = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }

unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
env_logger = "0.11"

# Calls v1: LiveKit (user↔user voice/video); prebuilt libwebrtc is fetched by webrtc-sys at build time.
livekit = { version = "0.9", default-features = false, features = ["native", "rustls-tls-webpki-roots"] }

# Voice (F11): capture, playback, WAV in memory.
cpal = "0.15"
# D79 initials avatars: the notification PNG draws its letters through the system sans-serif.
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
rodio = { version = "0.20", default-features = false, features = ["wav", "mp3", "symphonia-wav", "symphonia-isomp4", "symphonia-aac"] }
hound = "3.5"

# Sign in with GitHub (ASWebAuthenticationSession), notifications
# (UNUserNotificationCenter) and the Dock badge through objc2 (macOS only).
[target.'cfg(target_os = "macos")'.dependencies]
# Calls v1 camera capture: AVFoundation through nokhwa.
nokhwa = { version = "0.10", default-features = false, features = ["input-avfoundation"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSString", "NSError", "NSObject", "NSGeometry", "NSBundle", "NSArray", "NSSet", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSResponder", "NSDockTile"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationAttachment", "UNNotificationSound", "UNNotificationTrigger", "UNNotificationAction", "UNNotificationCategory"] }
objc2-authentication-services = { version = "0.3", default-features = false, features = ["std", "block2", "ASWebAuthenticationSession", "ASFoundation"] }
