[package]
name = "arbos-mac"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Arbos desktop client (GPUI)"
build = "build.rs"

[[bin]]
name = "arbos-mac"
path = "src/main.rs"

[dependencies]
arbos-core.workspace = true
arbos-update.workspace = true

anyhow.workspace = true
futures.workspace = true
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
reqwest.workspace = true
ulid.workspace = true

gpui = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54", features = ["wayland", "x11", "font-kit", "runtime_shaders"] }
gpui_tokio = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }

unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
env_logger = "0.11"
